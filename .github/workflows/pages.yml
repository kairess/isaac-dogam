# main 에 올라올 때마다 GitHub Pages 로 내보낸다.
# 빌드 단계가 없다. 정적 파일 그대로라 저장소 내용을 그대로 올리면 끝난다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 연달아 올려도 마지막 것만 배포되게 한다. 진행 중인 배포는 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement 를 켜 두면 저장소 설정에서 Pages 를 손으로 켜지 않아도 된다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
